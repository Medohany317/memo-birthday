<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="login-box">

        <h1>Our Little Secret</h1>

        <p>Only Mariam can enter ✨</p>

        <input
            type="text"
            id="username"

        >

    <script>

        function login() {

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            if (username === "i love u" && password === "27072026") {

                alert("Welcome to our world, Mariam ❤️");
                window.location.href = "mariam.html";

            } else {

                document.getElementById("error").innerText =
                    "Oops! That's not our secret 😏❤️";

            }

        }

    </script>
