<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>For Mariam ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="mariam-page">

    <div class="mariam-container">

        <div class="heart">❤️</div>

        <h1>Hi Mariam...</h1>

        <p class="intro">
            I made something special just for you.
        </p>

        <div class="mariam-photo">
            <img src="images/mariam.jpg" alt="Mariam">
        </div>

        <p class="message">
            Every picture has a story,
            and every story has a little piece of us. ❤️
        </p>

        <p class="message small">
            So... are you ready to remember them all? ✨
        </p>


        <a href="memories.html" class="memories-button">
    Open Our Memories ❤️
</a>


    </div>

<audio id="backgroundMusic" controls loop>
    <source src="music/song.mp3" type="audio/mpeg">
</audio>

<script>
    const music = document.getElementById("backgroundMusic");

    if (localStorage.getItem("musicStarted") === "true") {
        music.volume = 0.5;
        music.play().catch(error => {
            console.log("Music could not autoplay:", error);
        });
    }
    
</script>
    
</body>

</html>
